# Production compose for the self-hosted box (reference copy; the server keeps
# its own at ~/lexi/docker-compose.prod.yml — see deploy/SERVER-CHECKLIST.md).
#
#   docker compose -f docker-compose.prod.yml up -d --build   # deploy (on-box build)
#   docker compose -f docker-compose.prod.yml logs -f app     # watch app logs
#
# The image is built ON the server from the rsynced working tree — there is no
# registry/public image. Data lives in ./data (bind mount), which must be owned
# by uid 1000 because the image runs as the unprivileged `node` user.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    build: .
    restart: unless-stopped
    logging: *default-logging
    env_file: [.env]
    volumes:
      - ./data:/app/.data
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  caddy_data:
  caddy_config:
