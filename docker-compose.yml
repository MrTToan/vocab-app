# Self-host Lexi with Docker Compose.
#   docker compose up -d --build      # start (build first time)
#   docker compose logs -f            # watch logs
#   docker compose down               # stop
#
# Data: the host ./.data dir is bind-mounted, so the already-migrated lexi.db
# (and its backups/) are used directly and survive rebuilds. No Turso needed.
# Secrets: read from .env.local (LLM keys + AUTH_* for Google sign-in).

services:
  lexi:
    build: .
    restart: unless-stopped
    # Cap container logs (3 x 10 MB) — otherwise json-file logs grow unbounded.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # The image runs as uid 1000 (`node`); the bind-mounted ./.data dir must be
    # writable by that uid: `chown -R 1000:1000 .data` (or `chmod -R a+rwX`).
    # Host 3001 -> container 3000. Put a reverse proxy (see deploy/Caddyfile) in
    # front for HTTPS + your domain.
    ports:
      - "3001:3000"
    env_file:
      - .env.local
    volumes:
      # Persist the SQLite DB + backups on the host.
      - ./.data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
